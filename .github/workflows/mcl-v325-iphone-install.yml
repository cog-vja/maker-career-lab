name: MCL v3.25 iPhone one-file setup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check: preview only / install: add v3.25 source files'
        required: true
        type: choice
        options:
          - check
          - install
        default: check
      confirmation:
        description: 'For install only, enter INSTALL_V325'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: mcl-v325-one-file-installer
  cancel-in-progress: false

jobs:
  install:
    name: Safely install v3.25 (never auto-publish data)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check payload and optionally install
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "${MODE}" = "install" ] && [ "${CONFIRMATION}" != "INSTALL_V325" ]; then
            echo 'Safety check: enter INSTALL_V325 to apply the 24-file package.'
            exit 1
          fi
          mkdir -p /tmp/mcl-v325
          cat <<'MCL_V325_DATA' | base64 --decode > /tmp/mcl-v325/payload.zip
