
name: EDINET v3.2 CSV diagnose

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of reports (1-10); start with 1'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Test CSV parser
        run: python3 -m unittest -v test_v32.py

      - name: Diagnose EDINET CSV
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: python3 edinet_v32.py --discovery discovery-v31.json --limit "$LIMIT" --output edinet-v32-output

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edinet-v32-diagnostics
          path: edinet-v32-output/
          retention-days: 7
          if-no-files-found: warn
