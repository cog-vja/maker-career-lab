
name: EDINET v3.14 public dataset quality gate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview does not publish real-company data'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - publish

permissions:
  contents: read

jobs:
  release-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run v3.14 safety tests
        run: python3 -m unittest -v test_v314.py

      - name: Build gated dataset
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "publish" ]; then
            python3 build_release_v314.py --review fixtures-v314.zip --output v314-output --mode publish --approval release-approval-v314.json
          else
            python3 build_release_v314.py --review fixtures-v314.zip --output v314-output --mode preview
          fi

      - name: Upload review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edinet-v314-release-review
          path: v314-output/
          retention-days: 7
          if-no-files-found: warn
